<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Үздік оқушы — оқу қосымшасы</title>
<style>

  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Verdana, sans-serif;
    background:
      radial-gradient(circle at 8% 15%, #FFD166 0%, #FFD166 1.1%, transparent 1.3%),
      radial-gradient(circle at 82% 8%, #06D6A0 0%, #06D6A0 1.1%, transparent 1.3%),
      radial-gradient(circle at 65% 85%, #EF476F 0%, #EF476F 1.2%, transparent 1.4%),
      radial-gradient(circle at 25% 75%, #118AB2 0%, #118AB2 1%, transparent 1.2%),
      radial-gradient(circle at 92% 55%, #FFD166 0%, #FFD166 0.9%, transparent 1.1%),
      radial-gradient(circle at 45% 40%, #EF476F 0%, #EF476F 0.8%, transparent 1%),
      radial-gradient(circle at 12% 92%, #06D6A0 0%, #06D6A0 0.9%, transparent 1.1%),
      radial-gradient(circle at 55% 15%, #118AB2 0%, #118AB2 0.8%, transparent 1%),
      radial-gradient(circle at 35% 60%, #FFD166 0%, #FFD166 0.7%, transparent 0.9%),
      radial-gradient(circle at 75% 35%, #EF476F 0%, #EF476F 0.7%, transparent 0.9%),
      linear-gradient(135deg, #FFF2CC 0%, #FFDCEA 45%, #DDF4FF 100%);
    background-size: cover;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body.theme-boy {
    background:
      radial-gradient(circle at 8% 15%, #FFD166 0%, #FFD166 1.1%, transparent 1.3%),
      radial-gradient(circle at 82% 8%, #4CC9F0 0%, #4CC9F0 1.1%, transparent 1.3%),
      radial-gradient(circle at 65% 85%, #118AB2 0%, #118AB2 1.2%, transparent 1.4%),
      radial-gradient(circle at 25% 75%, #4CC9F0 0%, #4CC9F0 1%, transparent 1.2%),
      radial-gradient(circle at 92% 55%, #FFD166 0%, #FFD166 0.9%, transparent 1.1%),
      radial-gradient(circle at 45% 40%, #118AB2 0%, #118AB2 0.8%, transparent 1%),
      radial-gradient(circle at 12% 92%, #4CC9F0 0%, #4CC9F0 0.9%, transparent 1.1%),
      radial-gradient(circle at 55% 15%, #118AB2 0%, #118AB2 0.8%, transparent 1%),
      radial-gradient(circle at 35% 60%, #FFD166 0%, #FFD166 0.7%, transparent 0.9%),
      radial-gradient(circle at 75% 35%, #4CC9F0 0%, #4CC9F0 0.7%, transparent 0.9%),
      linear-gradient(135deg, #C9EBFF 0%, #A9DDFF 45%, #CFF3FF 100%);
  }
  body.theme-girl {
    background:
      radial-gradient(circle at 8% 15%, #FFD166 0%, #FFD166 1.1%, transparent 1.3%),
      radial-gradient(circle at 82% 8%, #FF6FA5 0%, #FF6FA5 1.1%, transparent 1.3%),
      radial-gradient(circle at 65% 85%, #EF476F 0%, #EF476F 1.2%, transparent 1.4%),
      radial-gradient(circle at 25% 75%, #FF8FAB 0%, #FF8FAB 1%, transparent 1.2%),
      radial-gradient(circle at 92% 55%, #FF6FA5 0%, #FF6FA5 0.9%, transparent 1.1%),
      radial-gradient(circle at 45% 40%, #EF476F 0%, #EF476F 0.8%, transparent 1%),
      radial-gradient(circle at 12% 92%, #FF8FAB 0%, #FF8FAB 0.9%, transparent 1.1%),
      radial-gradient(circle at 55% 15%, #FF6FA5 0%, #FF6FA5 0.8%, transparent 1%),
      radial-gradient(circle at 35% 60%, #FFD166 0%, #FFD166 0.7%, transparent 0.9%),
      radial-gradient(circle at 75% 35%, #EF476F 0%, #EF476F 0.7%, transparent 0.9%),
      linear-gradient(135deg, #FFD6E7 0%, #FFC2DD 45%, #FFE3EE 100%);
  }
  .text-xs{font-size:13px !important}
  .text-sm{font-size:15.5px !important}
  .text-base{font-size:18px !important}
  .text-lg{font-size:20.5px !important}
  .text-xl{font-size:23px !important}
  .text-2xl{font-size:27px !important}
  .text-3xl{font-size:34px !important}
  .text-4xl{font-size:41px !important}
  .text-5xl{font-size:55px !important}
  .pixel-panel{ border:4px solid #1F2937; box-shadow:6px 6px 0 #1F2937; }
  .pixel-btn{ border:3px solid #1F2937; box-shadow:4px 4px 0 #1F2937; transition:transform .05s ease; }
  .pixel-btn:active{ transform:translate(4px,4px); box-shadow:0 0 0 #1F2937; }
  .pixel-btn:disabled{ opacity:.45; box-shadow:none; cursor:not-allowed; }
  .pixel-btn:disabled:active{ transform:none; }
  @keyframes pop-correct {
    0%{ transform:scale(1); }
    35%{ transform:scale(1.09); }
    65%{ transform:scale(0.98); }
    100%{ transform:scale(1); }
  }
  .anim-correct{ animation: pop-correct .55s ease; }
  @keyframes shake-wrong {
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-5px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .anim-wrong{ animation: shake-wrong .45s ease; }
  @keyframes fade-in-up {
    0%{ opacity:0; transform:translateY(6px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .anim-feedback{ animation: fade-in-up .3s ease; }
  @keyframes pulse-attention {
    0%,100%{ transform:scale(1); box-shadow:6px 6px 0 #1F2937; }
    50%{ transform:scale(1.025); box-shadow:8px 8px 0 #1F2937; }
  }
  .anim-pulse-attention{ animation: pulse-attention 1.8s ease-in-out infinite; }
  .bg-soft-red{ background-color:#ff9d94; }
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{ background:#1F2937; border-radius:0; }
