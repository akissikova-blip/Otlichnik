const DAY_START_HOUR = 6;
const WEEKLY_CAP = 3000;

function pad(n){ return String(n).padStart(2,'0'); }
function getAppDate(d){
  const dt = new Date(d || Date.now());
  if (dt.getHours() < DAY_START_HOUR) dt.setDate(dt.getDate()-1);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getWeekStart(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function nextIntervalForBox(box){
  const map = {1:2, 2:4, 3:7, 4:14, 5:14};
  return map[box] || 14;
}
function updateBoxOnAnswer(rec, correct, today){
  const r = rec ? {...rec} : {box:0, correctCount:0, wrongCount:0, lastShown:null, nextDue:null};
  r.lastShown = today;
  if(correct){
    r.correctCount = (r.correctCount||0)+1;
    r.box = Math.min(5, (r.box||0)+1);
    r.nextDue = addDays(today, nextIntervalForBox(r.box));
  } else {
    r.wrongCount = (r.wrongCount||0)+1;
    r.box = 1;
    r.nextDue = addDays(today, 1);
  }
  return r;
}
function pickDaily(pool, boxes, today, count){
  const overdue=[], fresh=[], notDue=[];
  pool.forEach(item=>{
    const rec = boxes[item.id];
    if(!rec){ fresh.push(item); }
    else if(!rec.nextDue || rec.nextDue<=today){ overdue.push({item,rec}); }
    else { notDue.push({item,rec}); }
  });
  overdue.sort((a,b)=> (a.rec.nextDue||'').localeCompare(b.rec.nextDue||''));
  notDue.sort((a,b)=> (a.rec.nextDue||'').localeCompare(b.rec.nextDue||''));
  let selected = overdue.map(o=>o.item);
  if(selected.length<count) selected = selected.concat(shuffle(fresh).slice(0, count-selected.length));
  if(selected.length<count) selected = selected.concat(notDue.slice(0, count-selected.length).map(o=>o.item));
  if(selected.length<count && pool.length>0){
    let i=0;
    while(selected.length<count){ selected.push(pool[i % pool.length]); i++; }
  }
  return selected.slice(0, count);
}

function ensureWeek(pd, today){
  const ws = getWeekStart(today);
  if(pd.money.weekStart !== ws){
    pd.money.weekStart = ws;
    pd.money.weekTotal = 0;
  }
}
function awardMoney(pd, today, amount){
  if(amount<=0) return 0;
  ensureWeek(pd, today);
  const remaining = WEEKLY_CAP - pd.money.weekTotal;
  const actual = Math.max(0, Math.min(amount, remaining));
  pd.money.weekTotal += actual;
  pd.money.piggyTotal += actual;
  return actual;
}

    return {...base, ...parsed, subjects:{...base.subjects, ...parsed.subjects}};
  }catch(e){ return defaultProfileData(); }

  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);

    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   ПРОХОЖДЕНИЕ ПРЕДМЕТА (учёба)
   ============================================================ */
function SubjectFlow({subjectKey, pd, setPd, today, onFinish, onExit}){
  const s = pd.subjects[subjectKey];
  const isWordSubject = WORD_SUBJECTS.includes(subjectKey);
  const bank = bankFor(subjectKey, s.level);

  // Инициализация сессии, если её ещё нет
  React.useEffect(()=>{
    if(!s.sessionQuestions){
      const picked = pickDaily(bank, s.boxes, today, 10);
      setPd(prev=>{
        const next = JSON.parse(JSON.stringify(prev));
        next.subjects[subjectKey].sessionQuestions = picked.map(q=>q.id);
        next.subjects[subjectKey].sessionIndex = 0;
        next.subjects[subjectKey].sessionCorrect = 0;
        next.subjects[subjectKey].sessionStage = isWordSubject ? 'learn' : 'quiz';
        return next;
      });
    }
    // eslint-disable-next-line
  }, []);

  React.useEffect(()=>{
    if(!s.sessionQuestions && pd._lastResult){
      onFinish(pd._lastResult);
    }
    // eslint-disable-next-line
  }, [s.sessionQuestions]);

  if(!s.sessionQuestions){
    return <div className="min-h-screen flex items-center justify-center"><div className="text-lg">Жүктелуде...</div></div>;
  }

  const items = s.sessionQuestions.map(id => bank.find(b=>b.id===id)).filter(Boolean);
  const idx = s.sessionIndex;

  function commitAnswer(correct){
    setPd(prev=>{
      const next = JSON.parse(JSON.stringify(prev));
      const ns = next.subjects[subjectKey];
      const qid = ns.sessionQuestions[idx];
      ns.boxes[qid] = updateBoxOnAnswer(ns.boxes[qid], correct, today);
      ns.sessionCorrect += correct ? 1 : 0;
      ns.sessionIndex += 1;
      if(ns.sessionIndex >= ns.sessionQuestions.length){
        finalizeSession(next);
      }
      return next;
    });
  }

  function finalizeSession(next){
    const ns = next.subjects[subjectKey];
    const correct = ns.sessionCorrect;
    ns.lastDoneDate = today;
    ns.history = ns.history || [];
    ns.history.push({date: today, pct: correct*10});
    ns.sessionQuestions = null;
    ns.sessionIndex = 0;

    let earned = correct*6 + (correct===10 ? 15 : 0);
    const got = awardMoney(next, today, earned);

    // Проверка разблокировки уровня 2
    let leveledUp = false;
    if(ns.level === 1){
      const last3 = ns.history.slice(-3);
      if(last3.length===3 && last3.every(h=>h.pct>=80)){
        ns.level = 2;
        leveledUp = true;
      }
    }

    // Бонус за прохождение всех 5 предметов сегодня
    const allDone = SUBJECT_KEYS.every(k => next.subjects[k].lastDoneDate === today);
    if(allDone && !(next.money.dayBonusGiven||{})[today]){
      const bonusGot = awardMoney(next, today, 35);
      next.money.dayBonusGiven = next.money.dayBonusGiven || {};
      next.money.dayBonusGiven[today] = true;
      next._lastAllBonus = bonusGot;
    }
    next._lastResult = {correct, earned: got, leveledUp};
  }

  const currentItem = items[idx];

  if(isWordSubject){
    if(s.sessionStage === 'learn'){
      return (
        <WordLearnCard
          item={currentItem}
          index={idx}
          total={items.length}
          isEnglish={subjectKey==='english'}
          onNext={()=>{
            if(idx+1 < items.length){
              setPd(prev=>{
                const next = JSON.parse(JSON.stringify(prev));
                next.subjects[subjectKey].sessionIndex = idx+1;
                return next;
              });
            } else {
              setPd(prev=>{
                const next = JSON.parse(JSON.stringify(prev));
                next.subjects[subjectKey].sessionStage = 'check';
                next.subjects[subjectKey].sessionIndex = 0;
                return next;
              });
            }
          }}
          onExit={onExit}
        />
      );
    }
    // check stage
    const distractPool = bank.filter(b=>b.id!==currentItem.id);
    const distractors = sample(distractPool, Math.min(3, distractPool.length));
    const optionsRaw = shuffle([currentItem, ...distractors]);
    return (
      <WordCheckCard
        item={currentItem}
        options={optionsRaw}
        index={idx}
        total={items.length}
        isEnglish={subjectKey==='english'}
        onAnswer={(chosenId)=> commitAnswer(chosenId===currentItem.id)}
        onExit={onExit}
      />
    );
  }

  if(subjectKey==='reading'){
    const story = ALL_STORIES[currentItem.storyId];
    return (
      <ReadingCard
        story={story}
        question={currentItem}
        index={idx}
        total={items.length}
        onAnswer={(chosenIdx)=> commitAnswer(chosenIdx===currentItem.answer)}
        onExit={onExit}
      />
    );
  }

  return (
    <QuizCard
      question={currentItem}
      index={idx}
      total={items.length}
      onAnswer={(chosenIdx)=> commitAnswer(chosenIdx===currentItem.answer)}
      onExit={onExit}
    />
  );
}

   ЛЮБОПЫТНЫЙ ФАКТ
   ============================================================ */
function ensureTodaysFacts(pd, today){
  if(pd.facts.factsDate === today && pd.facts.order && pd.facts.order.length===6) return pd;
  const picks = [];
  FACT_CATS.forEach(cat=>{
    picks.push(...sample(FACTS[cat], 2).map(f=>f.id));
  });
  pd.facts.order = shuffle(picks);
  pd.facts.index = 0;
  pd.facts.factsDate = today;
  return pd;
}

function FactsSection({pd, setPd, today, onExit, onOpenQuiz}){
  React.useEffect(()=>{
    setPd(prev=>{
      const next = JSON.parse(JSON.stringify(prev));
      ensureTodaysFacts(next, today);
      return next;
    });
    // eslint-disable-next-line
  }, []);

  const order = pd.facts.order || [];
  const index = pd.facts.index || 0;
  if(order.length < 6){
    return <div className="min-h-screen flex items-center justify-center"><div>Жүктелуде...</div></div>;
  }
  const factId = order[index];
  const fact = findFact(factId);
  const isLast = index >= order.length-1;

  const readCount = (pd.facts.readIds||[]).length;
  const canQuiz = readCount>=3 && (!pd.facts.lastQuizDate || daysBetween(pd.facts.lastQuizDate, today)>=7);

  function next(){
    setPd(prev=>{
      const next = JSON.parse(JSON.stringify(prev));
      const rid = next.facts.order[next.facts.index];
      if(!next.facts.readIds.includes(rid)) next.facts.readIds.push(rid);
      if(next.facts.index >= next.facts.order.length-1){
        next.facts.order = shuffle(next.facts.order);
        next.facts.index = 0;
      } else {
        next.facts.index += 1;
      }
      return next;
    });
  }

  return (
    <div className="min-h-screen p-4 max-w-lg mx-auto flex flex-col gap-4">
      <TopBar index={index} total={6} onExit={onExit} label="Факт"/>
      <div className="pixel-panel bg-indigo-50 p-6 flex flex-col items-center gap-3 text-center flex-1">
        <div className="text-5xl">{fact.emoji}</div>
        <div className="text-sm font-bold text-gray-500">{FACT_CAT_LABEL[fact.category]}</div>
        <div className="text-lg text-gray-800">{fact.text}</div>
      </div>
      <PixelBtn color="bg-lime-300" className="w-full" onClick={next}>
        {isLast ? 'Заново →' : 'Ещё факт →'}
      </PixelBtn>
      {canQuiz && (
        <PixelBtn color="bg-yellow-300" className="w-full" onClick={onOpenQuiz}>🎯 Викторина!</PixelBtn>
      )}
    </div>
  );
}

function FactsQuiz({pd, setPd, today, onExit}){
  const readIds = pd.facts.readIds || [];
  const [questions] = React.useState(()=>{
    const chosen = sample(readIds, Math.min(5, readIds.length));
    return chosen.map(id=>{
      const correct = findFact(id);
      const sameCat = FACTS[correct.category].filter(f=>f.id!==id);
      const distractors = sample(sameCat, Math.min(2, sameCat.length));
      const opts = shuffle([correct, ...distractors].map(f=>f.text));
      return { emoji: correct.emoji, category: correct.category, correctText: correct.text, options: opts };
    });
  });
  const [idx, setIdx] = React.useState(0);
  const [score, setScore] = React.useState(0);
  const [picked, setPicked] = React.useState(null);
  const [done, setDone] = React.useState(false);

  function answer(opt){
    setPicked(opt);
    const correct = opt === questions[idx].correctText;
    setTimeout(()=>{
      setScore(s=> s + (correct?1:0));
      if(idx+1 < questions.length){ setIdx(idx+1); setPicked(null); }
      else {
        setDone(true);
        setPd(prev=>{
          const next = JSON.parse(JSON.stringify(prev));
          next.facts.lastQuizDate = today;
          return next;
        });
      }
    }, 700);
  }

  if(questions.length===0){
    return <div className="min-h-screen flex items-center justify-center"><div>Факт жеткіліксіз.</div></div>;
  }

  if(done){
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="pixel-panel bg-white p-6 max-w-sm w-full flex flex-col items-center gap-3 text-center">
          <div className="text-5xl">🎯</div>
          <div className="text-2xl font-black text-gray-800">{score} / {questions.length}</div>
          <PixelBtn color="bg-lime-300" className="w-full" onClick={onExit}>Жарайды</PixelBtn>
        </div>
      </div>
    );
  }

  const q = questions[idx];
  return (
    <div className="min-h-screen p-4 max-w-lg mx-auto flex flex-col gap-4">
      <TopBar index={idx} total={questions.length} onExit={onExit} label="Викторина"/>
      <div className="pixel-panel bg-white p-6 text-center">
        <div className="text-4xl mb-2">{q.emoji}</div>
        <div className="text-base text-gray-500">{FACT_CAT_LABEL[q.category]} туралы қай факт дұрыс?</div>
      </div>
      <div className="flex flex-col gap-3">
        {q.options.map((opt,i)=>{
          const state = picked===null ? '' : (opt===q.correctText ? 'bg-lime-300' : (opt===picked ? 'bg-red-200' : 'opacity-50'));
          return (
            <button key={i} disabled={picked!==null} onClick={()=>answer(opt)}
              className={`pixel-panel p-3 bg-white text-left text-sm font-bold text-gray-800 ${state}`}>{opt}</button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   КАБИНЕТ РОДИТЕЛЯ
   ============================================================ */
function getParentPassword(){ return localStorage.getItem(PASSWORD_KEY); }
function setParentPassword(p){ localStorage.setItem(PASSWORD_KEY, p); }

function last14Dates(today){
  const arr=[];
  for(let i=13;i>=0;i--) arr.push(addDays(today, -i));
  return arr;
}
function activityColor(pct){
  if(pct===null || pct===undefined) return '#E5E7EB';
  if(pct>=80) return '#4ADE80';
  if(pct>=50) return '#FDE047';
  return '#FB923C';
}
function avgPct(history){
  if(!history || history.length===0) return 0;
  return Math.round(history.reduce((a,h)=>a+h.pct,0)/history.length);
}

function ParentCabinet({profiles, today, onExit, onDataChanged}){
  const stored = getParentPassword();
  const [unlocked, setUnlocked] = React.useState(false);
  const [pw1, setPw1] = React.useState('');
  const [pw2, setPw2] = React.useState('');
  const [error, setError] = React.useState('');
  const [selectedId, setSelectedId] = React.useState(profiles[0] ? profiles[0].id : null);
  const [childPd, setChildPd] = React.useState(selectedId ? loadProfileData(selectedId) : null);
  const [showChangePw, setShowChangePw] = React.useState(false);
  const [choreEditing, setChoreEditing] = React.useState(null);
  const [choreForm, setChoreForm] = React.useState({name:'', icon:'⭐', days:[0,1,2,3,4,5,6]});

  React.useEffect(()=>{
    if(selectedId) setChildPd(loadProfileData(selectedId));
  }, [selectedId]);

  function persist(mutator){
    setChildPd(prev=>{
      const next = JSON.parse(JSON.stringify(prev));
      mutator(next);
      saveProfileData(selectedId, next);
      onDataChanged();
      return next;
    });
  }

  if(!profiles.length){
    return (
      <div className="min-h-screen flex flex-col items-center justify-center p-4 gap-4">
        <div className="text-lg">Алдымен балаға профиль жасаңыз.</div>
        <PixelBtn onClick={onExit}>Артқа</PixelBtn>
      </div>
    );
  }

  if(!unlocked){
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="pixel-panel bg-white p-6 max-w-sm w-full flex flex-col gap-3">
          <div className="text-xl font-bold text-center">🔒 Ата-ана кабинеті</div>
          {!stored && (
            <>
              <div className="text-sm text-gray-600">Алғаш рет кіру: құпия сөз жасаңыз (кемінде 4 таңба)</div>
              <input type="password" value={pw1} onChange={e=>setPw1(e.target.value)} placeholder="Құпия сөз"
                className="pixel-btn shadow-none px-3 py-2 text-base"/>
              <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="Қайталаңыз"
                className="pixel-btn shadow-none px-3 py-2 text-base"/>
              {error && <div className="text-sm text-red-600">{error}</div>}
              <PixelBtn color="bg-lime-300" onClick={()=>{
                if(pw1.length<4){ setError('Кемінде 4 таңба керек'); return; }
                if(pw1!==pw2){ setError('Сәйкес келмейді'); return; }
                setParentPassword(pw1); setUnlocked(true); setError('');
              }}>Құру</PixelBtn>
            </>
          )}
          {stored && (
            <>
              <input type="password" value={pw1} onChange={e=>setPw1(e.target.value)} placeholder="Құпия сөз"
                className="pixel-btn shadow-none px-3 py-2 text-base"/>
              {error && <div className="text-sm text-red-600">{error}</div>}
              <PixelBtn color="bg-lime-300" onClick={()=>{
                if(pw1===stored){ setUnlocked(true); setError(''); } else { setError('Қате құпия сөз'); }
              }}>Кіру</PixelBtn>
            </>
          )}
          <button onClick={onExit} className="text-sm text-gray-500 underline mt-2">Артқа</button>
        </div>
      </div>
    );
  }

  if(!childPd) return null;

  const weekday = new Date(today+'T12:00:00').getDay();
  const hwToday = (childPd.homework[today]||{}).status;
  const choresToday = childPd.chores.filter(c=>c.days.includes(weekday));
  const pendingChores = choresToday.filter(c=>{
    const st = (childPd.choreStatus[today]||{})[c.id];
    return st && st.confirm==='wait';
  });

  const days14 = last14Dates(today);

  return (
    <div className="min-h-screen p-4 max-w-lg mx-auto flex flex-col gap-4 pb-16">
      <TopBar index={0} total={1} onExit={onExit} label=""/>
      <div className="text-xl font-black text-gray-800">👪 Ата-ана кабинеті</div>

      <select value={selectedId} onChange={e=>setSelectedId(e.target.value)}
        className="pixel-btn shadow-none px-3 py-2 text-base">
        {profiles.map(p=> <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>)}
      </select>

      <div className="pixel-panel bg-white p-3 grid grid-cols-3 gap-2 text-center">
        <div><div className="text-2xl">⭐</div><div className="text-sm font-bold">{SUBJECT_KEYS.reduce((a,k)=>a+Object.values(childPd.subjects[k].boxes).reduce((x,b)=>x+(b.correctCount||0),0),0)}</div></div>
        <div><div className="text-2xl">📅</div><div className="text-sm font-bold">{SUBJECT_KEYS.reduce((a,k)=>a+childPd.subjects[k].history.length,0)}</div></div>
        <div><div className="text-2xl">🐷</div><div className="text-sm font-bold">{childPd.money.piggyTotal||0} ₸</div></div>
      </div>

      {(hwToday==='done_wait' || pendingChores.length>0) && (
        <div className="pixel-panel bg-yellow-50 p-3">
          <div className="text-base font-bold mb-2">⏳ Растауды күтуде</div>
          {hwToday==='done_wait' && (
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm">📝 Үй тапсырмасы</span>
              <div className="flex gap-2">
                <button onClick={()=>persist(n=>{ n.homework[today]={status:'confirmed'}; awardMoney(n,today,75); })} className="pixel-btn px-2 py-1 bg-lime-300">✅</button>
                <button onClick={()=>persist(n=>{ n.homework[today]={status:'rejected'}; })} className="pixel-btn px-2 py-1 bg-red-200">❌</button>
              </div>
            </div>
          )}
          {pendingChores.map(c=>(
            <div key={c.id} className="flex items-center justify-between mb-2">
              <span className="text-sm">{c.icon} {c.name}</span>
              <div className="flex gap-2">
                <button onClick={()=>persist(n=>{ n.choreStatus[today][c.id].confirm='yes'; awardMoney(n,today,15); })} className="pixel-btn px-2 py-1 bg-lime-300">✅</button>
                <button onClick={()=>persist(n=>{ n.choreStatus[today][c.id].confirm='no'; })} className="pixel-btn px-2 py-1 bg-red-200">❌</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="pixel-panel bg-white p-3">
        <div className="text-base font-bold mb-2">📊 Дәлдік (жалпы)</div>
        {SUBJECT_KEYS.map(k=>{
          const a = avgPct(childPd.subjects[k].history);
          return (
            <div key={k} className="mb-2">
              <div className="text-xs text-gray-600 flex justify-between"><span>{SUBJECT_ICONS[k]} {SUBJECT_LABELS[k]} (Д{childPd.subjects[k].level})</span><span>{a}%</span></div>
              <div className="w-full h-3 bg-gray-100 border border-gray-800">
                <div className="h-full bg-indigo-400" style={{width:a+'%'}}></div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="pixel-panel bg-white p-3">
        <div className="text-base font-bold mb-2">🗓️ Соңғы 14 күн</div>
        {SUBJECT_KEYS.map(k=>{
          const hist = childPd.subjects[k].history;
          return (
            <div key={k} className="mb-2">
              <div className="text-xs text-gray-600 mb-1">{SUBJECT_ICONS[k]} {SUBJECT_LABELS[k]}</div>
              <div className="flex gap-1">
                {days14.map(d=>{
                  const entry = hist.find(h=>h.date===d);
                  return <div key={d} title={d} style={{width:14,height:14,background:activityColor(entry?entry.pct:null)}}/>;
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="pixel-panel bg-white p-3">
        <div className="text-base font-bold mb-1">💰 Ақша ережесі</div>
        <div className="text-xs text-gray-600 leading-relaxed">
          Дұрыс жауап — 6 ₸, 10/10 болса +15 ₸ бонус. 5 пәннің барлығы бір күнде — +35 ₸. Үй тапсырмасы (расталған) — 75 ₸. Әр үй шаруасы (расталған) — 15 ₸. Аптасына жиынтық барлығы — <b>{WEEKLY_CAP} ₸-ден аспайды</b>.
        </div>
        <div className="text-sm font-bold mt-2">Осы апта: {childPd.money.weekTotal||0} / {WEEKLY_CAP} ₸</div>
        <PixelBtn color="bg-pink-200" className="mt-2 w-full" onClick={()=>{
          if(window.confirm('Ақша нақты берілді ме? Копилка нөлденеді.')){
            persist(n=>{ n.money.piggyTotal = 0; });
          }
        }}>Выплатить и обнулить копилку</PixelBtn>
      </div>

      <div className="pixel-panel bg-white p-3">
        <div className="text-base font-bold mb-2">🧹 Үй шаруасы тізімі</div>
        {childPd.chores.map(c=>(
          <div key={c.id} className="flex items-center justify-between mb-2 border-b pb-1">
            <div className="text-sm">{c.icon} {c.name} <span className="text-xs text-gray-400">({c.days.map(d=>WEEKDAY_LABELS[d]).join(',')})</span></div>
            <div className="flex gap-1">
              <button className="text-sm" onClick={()=>{ setChoreEditing(c.id); setChoreForm({name:c.name, icon:c.icon, days:c.days}); }}>✏️</button>
              <button className="text-sm" onClick={()=>persist(n=>{ n.chores = n.chores.filter(x=>x.id!==c.id); })}>🗑️</button>
            </div>
          </div>
        ))}

        <div className="mt-3 flex flex-col gap-2">
          <div className="text-sm font-bold">{choreEditing ? 'Дела өзгерту' : 'Жаңа дело қосу'}</div>
          <div className="flex gap-2">
            <input value={choreForm.icon} onChange={e=>setChoreForm({...choreForm, icon:e.target.value})}
              className="pixel-btn shadow-none px-2 py-1 w-16 text-center" maxLength={2}/>
            <input value={choreForm.name} onChange={e=>setChoreForm({...choreForm, name:e.target.value})}
              placeholder="Атауы" className="pixel-btn shadow-none px-2 py-1 flex-1"/>
          </div>
          <div className="flex flex-wrap gap-1">
            {WEEKDAY_LABELS.map((lbl,i)=>(
              <button key={i} onClick={()=>{
                const has = choreForm.days.includes(i);
                setChoreForm({...choreForm, days: has ? choreForm.days.filter(d=>d!==i) : [...choreForm.days,i]});
              }} className={`px-2 py-1 text-xs border-2 ${choreForm.days.includes(i)?'bg-lime-300 border-gray-800':'border-gray-300'}`}>{lbl}</button>
            ))}
          </div>
          <div className="flex gap-2">
            {choreEditing && <PixelBtn color="bg-gray-200" onClick={()=>{ setChoreEditing(null); setChoreForm({name:'',icon:'⭐',days:[0,1,2,3,4,5,6]}); }}>Бас тарту</PixelBtn>}
            <PixelBtn color="bg-lime-300" className="flex-1" onClick={()=>{
              if(!choreForm.name.trim()) return;
              persist(n=>{
                if(choreEditing){
                  const idx = n.chores.findIndex(x=>x.id===choreEditing);
                  if(idx>=0) n.chores[idx] = {id:choreEditing, name:choreForm.name.trim(), icon:choreForm.icon, days:choreForm.days};
                } else {
                  n.chores.push({id:uid(), name:choreForm.name.trim(), icon:choreForm.icon, days:choreForm.days});
                }
              });
              setChoreEditing(null);
              setChoreForm({name:'', icon:'⭐', days:[0,1,2,3,4,5,6]});
            }}>{choreEditing ? 'Сақтау' : 'Қосу'}</PixelBtn>
          </div>
        </div>
      </div>

      <div className="pixel-panel bg-white p-3">
        <button onClick={()=>setShowChangePw(!showChangePw)} className="text-base font-bold">🔑 Құпия сөзді өзгерту</button>
        {showChangePw && (
          <div className="flex flex-col gap-2 mt-2">
            <input type="password" placeholder="Жаңа құпия сөз" id="newpw"
              onChange={e=>setPw1(e.target.value)} className="pixel-btn shadow-none px-3 py-2"/>
            <PixelBtn color="bg-lime-300" onClick={()=>{
              if(pw1.length<4) return;
              setParentPassword(pw1); setShowChangePw(false); setPw1('');
            }}>Сақтау</PixelBtn>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   ГЛАВНОЕ ПРИЛОЖЕНИЕ
   ============================================================ */
function App(){
  const [profiles, setProfiles] = React.useState(loadProfiles());
  const [activeId, setActiveId] = React.useState(null);
  const [pd, setPd] = React.useState(null);
  const [view, setView] = React.useState('home');
  const [activeSubject, setActiveSubject] = React.useState(null);
  const [result, setResult] = React.useState(null);
  const [today, setToday] = React.useState(getAppDate());

  React.useEffect(()=>{
    const t = setInterval(()=> setToday(getAppDate()), 60000);
    return ()=> clearInterval(t);
  }, []);

  React.useEffect(()=>{
    if(activeId && pd){ saveProfileData(activeId, pd); }
  }, [pd, activeId]);

  function selectProfile(id){
    setActiveId(id);
    setPd(loadProfileData(id));
    setView('home');
  }
  function createProfile(name, avatar){
    const p = { id: uid(), name, avatar };
    const list = [...profiles, p];
    setProfiles(list);
    saveProfiles(list);
    selectProfile(p.id);
  }
  function switchProfile(){
    setActiveId(null); setPd(null); setView('home');
  }
  function openSubject(key){ setActiveSubject(key); setView('subject'); }
  function onSubjectFinish(res){
    setResult(res);
    setPd(prev=>{
      const next = JSON.parse(JSON.stringify(prev));
      delete next._lastResult;
      return next;
    });
    setView('result');
  }
  function reloadPd(){
    if(activeId) setPd(loadProfileData(activeId));
  }

  if(!activeId){
    return (
      <ProfileSelect
        profiles={profiles}
        onSelect={selectProfile}
        onCreate={createProfile}
        onOpenParent={()=>setView('parentFromSelect')}
      />
    );
  }

  if(view==='parentFromSelect'){
    return <ParentCabinet profiles={profiles} today={today}
      onExit={()=>setView('home')}
      onDataChanged={()=>{}}
    />;
  }

  if(!pd) return null;

  if(view==='parent'){
    return <ParentCabinet profiles={profiles} today={today}
      onExit={()=>{ reloadPd(); setView('home'); }}
      onDataChanged={()=>{}}
    />;
  }

  if(view==='subject' && activeSubject){
    return <SubjectFlow subjectKey={activeSubject} pd={pd} setPd={setPd} today={today}
      onFinish={onSubjectFinish}
      onExit={()=>{
        setPd(prev=>{
          const next = JSON.parse(JSON.stringify(prev));
          return next;
        });
        setView('home');
      }}
    />;
  }

  if(view==='result'){
    return <ResultScreen result={result} onDone={()=>{ setResult(null); setView('home'); }}/>;
  }

  if(view==='homework'){
    return <HomeworkScreen pd={pd} setPd={setPd} today={today} onExit={()=>setView('home')}/>;
  }
  if(view==='chores'){
    return <ChoresScreen pd={pd} setPd={setPd} today={today} onExit={()=>setView('home')}/>;
  }
  if(view==='piggy'){
    return <PiggyBank pd={pd} today={today} onExit={()=>setView('home')}/>;
  }
  if(view==='facts'){
    return <FactsSection pd={pd} setPd={setPd} today={today}
      onExit={()=>setView('home')}
      onOpenQuiz={()=>setView('factsQuiz')}
    />;
  }
  if(view==='factsQuiz'){
    return <FactsQuiz pd={pd} setPd={setPd} today={today} onExit={()=>setView('facts')}/>;
  }

  const profile = profiles.find(p=>p.id===activeId);
  return (
    <Home
      profile={profile}
      pd={pd}
      today={today}
      onOpenSubject={openSubject}
      onOpenFacts={()=>setView('facts')}
      onOpenPiggy={()=>setView('piggy')}
      onOpenParent={()=>setView('parent')}
      onSwitchProfile={switchProfile}
      onOpenHomework={()=>setView('homework')}
      onOpenChores={()=>setView('chores')}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
